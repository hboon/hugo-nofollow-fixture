name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.169.0
      # From hugo_0.169.0_checksums.txt in the v0.169.0 GitHub release.
      HUGO_LINUX_AMD64_SHA256: 2d2f0bfe357d8cb4cec02f6bb28a3bff34978c8dda44b618029c5eb9d66765a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Hugo and verify its checksum
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_LINUX_AMD64_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Confirm the Hugo version
        run: hugo version | grep -F "hugo v${HUGO_VERSION}-"

      - name: Build
        run: hugo --destination public

      - name: Check links
        run: node scripts/check-links.ts public
